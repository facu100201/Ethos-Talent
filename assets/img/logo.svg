  <path d="M17 38h14" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Reflejo de gloss -->
  <path d="M0 11a11 11 0 0 1 11-11h26a11 11 0 0 1 11 11v9c-8 5-16 7-24 7S8 25 0 20z" fill="url(#gloss)"/>
